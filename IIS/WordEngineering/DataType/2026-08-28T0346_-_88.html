<!DOCTYPE html>
<html>
	<head>
		<!--
			2026-08-28	Created.
			I saw the number 88, and to its east probably 2's. Since there is a white separator, I guess the 88 is a 2-digit year.
			2026-08-28T22:23:00	http://stackoverflow.com/questions/175739/how-can-i-check-if-a-string-is-a-valid-number
			2026-08-28T22:24:00	Check for its a year?
		-->
		<title>2026-08-28T03:46:00 88</title>
		<meta charset="UTF-8"/>
		<meta name="description" content="2026-08-28T03:46:00 88"/>
		<meta name="keywords" content="2026-08-28T03:46:00, 88"/>
		<meta name="robots" content="index, follow"/>
		<meta name="author" content="Ken Adeniji"/>
		<style>
	html, body{
	  height: 100%;
	  width: 100%;
	}
	textarea{ //viewport
		height: 65vh;
		width: 50vw;
	}
body {
	/*background-color: #FF9500; */
	border: 5px solid black; /* The line that is drawn around each edge of the box. */
	margin: 0 auto; /* Is what separates one tag from another. */
	padding: 0 20px 20px 20px; /* Is the space between the content and the content's border. */ 
	/* width: 600px; */
}

.focus {
  background-color: #ff00ff;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
}

/* div inside a div, border. */

	background-color: #00539F;

table {
   border: 1px solid black;
   border-spacing: 5px;
   border-collapse: separate;
   /* width:100%; */

	padding:5px 10px; border:#4e95f4 1px solid;
}

		</style>	
	</head>
	<body>
		<div align="center">
			<table>
				<tr>
					<td><label for="word">Word</label></td>
					<td><input id="word" type="text" autofocus/></td>
				</tr>
				<tr>
					<td><label for="dated">Dated</label></td>
					<td><input id="dated" type="datetime-local"/></td>
				</tr>
				<tr>
					<td colspan="2" align="center"><input type="submit" id="submitQuery"></td>
				</tr>	
			</table>
			<div id="resultSet"></div>
		</div>
		<script>
			var 	isPostBack = false;
	
			const 	wordElement = document.getElementById("word");	
			const 	datedElement = document.getElementById("dated");
			const	submitQueryElement = document.getElementById("submitQuery");
			const	resultSetElement = document.getElementById("resultSet");
			
			function pageLoad()
			{
				if (isPostBack === false)
				{
					const urlParams = new URLSearchParams(window.location.search);

					var wordParam = urlParams.get("word");
					if (wordParam)
					{
						wordElement.value = wordParam;
					}
					else
					{
						wordElement.value = Word_Default;
					}
					
					var datedParam = urlParams.get("dated");
					if (datedParam)
					{
						datedElement.value = datedParam;
					}
					else
					{
						var now = new Date();
						now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
						datedElement.value = now.toISOString().slice(0,16);
					}
				
					querySubmit();
					isPostBack = true;
				}
				else
				{
					querySubmit();
				}
			}

			function querySubmit()
			{
				resultSetElement.innerHTML = Table_Template_Top +
					processYears() +
					processMonths() +
					processDays()
			}

			function processDays()
			{
				let	validDay = false;
				let	preDay = "";
				let	postDay = "";
				
				if 
				( 
						isNaN(wordElement.value) === false 
					&&	wordElement.value >= 1
					&&	wordElement.value <= 31
				)
				{
					validDay = true;
					preDay = addDays(datedElement.value, -1 * Math.abs(wordElement.value)); 
					postDay = addDays(datedElement.value, Math.abs(wordElement.value)); 
				}

				return `<tr><td>Day(s)</td><td>${validDay}</td><td>${preDay}</td><td>${postDay}</td></tr>`;
			}
			
			function addDays(myDate, days) 
			{
				var result = new Date(myDate);
				result.setDate(result.getDate() + days);
				return result;
			};
			
			function processMonths()
			{
				let	validMonth = false;
				let	preMonth = "";
				let	postMonth = "";
				
				if 
				( 
						isNaN(wordElement.value) === false 
					&&	wordElement.value >= 1
					&&	wordElement.value <= 12
				)
				{
					validMonth = true;
					preMonth = addMonths(datedElement.value, -1 * Math.abs(wordElement.value)); 
					postMonth = addMonths(datedElement.value, Math.abs(wordElement.value)); 
				}

				return `<tr><td>Month(s)</td><td>${validMonth}</td><td>${preMonth}</td><td>${postMonth}</td></tr>`;
			}
			
			function addMonths(myDate, months) 
			{
				var result = new Date(myDate);
				result.setMonth(result.getMonth() + months);
				return result;
			};

			function processYears()
			{
				let	validYear = false;
				let	preYear = "";
				let	postYear = "";
				
				if 
				( 
						isNaN(wordElement.value) === false 
					&&	wordElement.value >= Year_From
				)
				{
					validYear = true;
					preYear = addYears(datedElement.value, -1 * Math.abs(wordElement.value)); 
					postYear = addYears(datedElement.value, Math.abs(wordElement.value)); 
				}

				return `<tr><td>Year(s)</td><td>${validYear}</td><td>${preYear}</td><td>${postYear}</td></tr>`;
			}
			
			function addYears(myDate, years) 
			{
				var result = new Date(myDate);
				result.setFullYear(result.getFullYear() + years);
				return result;
			};

			submitQueryElement.addEventListener("click", querySubmit, false);
			
			var body = document.getElementsByTagName("body")[0];
			body.onkeydown = function (e) {
				if (e.keyCode === 13) {  //enter key code
					querySubmit();
				}
			}

			window.addEventListener("load", pageLoad, false);
			
			const Word_Default = "88 ";
			
			const Table_Template_Top = "<table><thead><tr><th>Metric</th><th>Valid</th><th>Pre dated</th><th>Post dated</th></thead><tbody>";
			
			const Year_From = -4000
		</script>
	</body>
</html>
