    <body>
		<form
			action="mailto:KenAdeniji@hotmail.com"
			method="post"
			enctype="text/plain"
		>
			<div>
				<label for="firstName">First Name</label><br/>
				<input autocomplete="given-name" name="firstName" id="firstName" required maxlength="40" type="text" autofocus/>
			</div>
			<div>
				<label for="middleName">Middle Name</label><br/>
				<input autocomplete="additional-name" name="middleName" id="middleName" maxlength="40" type="text"/>
			</div>
			<div>
				<label for="lastName">Last Name</label><br/>
				<input autocomplete="family-name" name="lastName" id="lastName" required maxlength="40" type="text"/>
			</div>
			<div>
				<label for="organization">Organization</label><br/>
				<input name="organization" id="organization" maxlength="80" type="text"/>
			</div>
			<div>
				<label for="address1">Address 1</label><br/>
				<input autocomplete="address-line1" name="address1" id="address1" required maxlength="200" type="text"/>
			</div>
			<div>
				<label for="address2">Address 2</label><br/>
				<input autocomplete="address-line2" name="address2" id="address2" maxlength="200" type="text"/>
			</div>
			<div>
				<label for="city">City</label><br/>
				<input autocomplete="address-level2" name="city" id="city" required maxlength="40" type="text"/>
			</div>
			<div>
				<label for="state">State / Province / Region</label><br/>
				<input autocomplete="address-level1" name="state" id="state" required maxlength="40" type="text"/>
			</div>
			<div>
				<label for="zipcode">ZIP Code</label><br/>
				<input autocomplete="postal-code" name="zipcode" id="zipcode" required maxlength="10" type="text"/>
			</div>
			<div>
				<label for="country">Country</label><br/>
				<input autocomplete="country-name" name="country" id="country" required maxlength="80" type="text"/>
			</div>
			<div>
				<label for="phone">Phone</label><br/>
				<input autocomplete="tel-national" name="phone" id="phone" maxlength="38" type="tel" pattern="[+0-9\(\)\/. \-]+" placeholder="(123) 456-7890" title="Telephone number with area code, and country code if outside the US"/>
			</div>
			<div>
				<label for="phone">Email</label><br/>
				<input autocomplete="email" name="email_address" id="email_address" required maxlength="80" type="email" placeholder="email@example.com" title="Enter an email address."/>
			</div>
			<div>
				<label for="message">Comments</label><br/>
				<textarea rows="8" name="message" id="message" required maxlength="4000" data-showcounter title="Maximum 4000 characters."></textarea>
			</div>
			<div>
				<input id="submitQuery" value="Submit" type="submit"/>
			</div>	
		</form>
    </body>
