			async function querySubmit()
			{
				let 	baseTableHTML = "<table><thead><tr><th>Number</th>";
				const 	baseTo = baseConvertToElement.value.split(/[,;]/);

				baseTo.forEach
				(
					(baseToCurrent) =>

					}	
				);

				baseTableHTML += "</tr></thead><tbody>";

				for 
				(

						valueFrom = parseFloat(valueToConvertFromElement.value),
						valueUntil = parseFloat(valueToConvertUntilElement.value),
						valueStep = parseFloat(convertStepElement.value),
						valueMeasure = valueFrom,
						baseFrom = parseFloat(baseConvertFromElement.value)
					;	
					valueMeasure <= valueUntil; 
					valueMeasure += valueStep
				) 
				{
					baseTableHTML += `<tr><td>${valueMeasure}</td>`;
					baseTo.forEach
					(
						(baseToCurrent) => 
						{
							baseTableHTML += `<td>${convertBase(String(valueMeasure), baseFrom, baseToCurrent)}</td>`;
						}
					);
					baseTableHTML += "</tr>";
				}
				baseTableHTML += "</tbody></table>";
				resultSetElement.innerHTML = baseTableHTML;
			}
			
			function convertBaseOther(value, from_base, to_base) {
			  var range = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ+/'.split('');
			  var from_range = range.slice(0, from_base);
			  var to_range = range.slice(0, to_base);
			  
			  var dec_value = value.split('').reverse().reduce(function (carry, digit, index) {
				if (from_range.indexOf(digit) === -1) throw new Error('Invalid digit `'+digit+'` for base '+from_base+'.');
				return carry += from_range.indexOf(digit) * (Math.pow(from_base, index));
			  }, 0);
			  
			  var new_value = '';
			  while (dec_value > 0) {
				new_value = to_range[dec_value % to_base] + new_value;
				dec_value = (dec_value - (dec_value % to_base)) / to_base;
			  }
			  return new_value || '0';
			}
			
// Source - https://stackoverflow.com/a/55011290
// Posted by Slavik Meltser, modified by community. See post 'Timeline' for change history
// Retrieved 2026-10-05, License - CC BY-SA 4.0

function convertBase(str, fromBase, toBase) {

    const DIGITS = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ+/";

    const add = (x, y, base) => {
        let z = [];
        const n = Math.max(x.length, y.length);
        let carry = 0;
        let i = 0;
        while (i < n || carry) {
            const xi = i < x.length ? x[i] : 0;
            const yi = i < y.length ? y[i] : 0;
            const zi = carry + xi + yi;
            z.push(zi % base);
            carry = Math.floor(zi / base);
            i++;
        }
        return z;
    }

    const multiplyByNumber = (num, x, base) => {
        if (num < 0) return null;
        if (num == 0) return [];

        let result = [];
        let power = x;
        while (true) {
            num & 1 && (result = add(result, power, base));
            num = num >> 1;
            if (num === 0) break;
            power = add(power, power, base);
        }

        return result;
    }

    const parseToDigitsArray = (str, base) => {
        const digits = str.split('');
        let arr = [];
        for (let i = digits.length - 1; i >= 0; i--) {
            const n = DIGITS.indexOf(digits[i])
            if (n == -1) return null;
            arr.push(n);
        }
        return arr;
    }

    const digits = parseToDigitsArray(str, fromBase);
    if (digits === null) return null;

    let outArray = [];
    let power = [1];
    for (let i = 0; i < digits.length; i++) {
        digits[i] && (outArray = add(outArray, multiplyByNumber(digits[i], power, toBase), toBase));
        power = multiplyByNumber(fromBase, power, toBase);
    }

    let out = '';
    for (let i = outArray.length - 1; i >= 0; i--)
        out += DIGITS[outArray[i]];

    return out;
}
