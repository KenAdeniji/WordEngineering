	<body>
		<div align="center">
			<table>
				<tr>
					<td><label for="word">Word</label></td>
					<td><input id="word" type="text" value="19.35" autofocus></td>
				</tr>
				<tr>
					<td colspan="2" align="center"><input type="submit" id="submitQuery"></td>
				</tr>
			</table>
			<div id="scriptureReference"></div>
		</div>

		<script>
			let scriptElement = document.createElement("script");
			scriptElement.setAttribute("src", "./Bible.js");
			document.body.appendChild(scriptElement);
		</script>

		<script>
			const	wordElement = document.getElementById("word");
			const	submitQueryElement = document.getElementById("submitQuery");
			
			const	scriptureReferenceElement = document.getElementById("scriptureReference");
			
			var 	isPostBack = false;

			function pageLoad()
			{
				if (isPostBack === false)
				{
					const urlParams = new URLSearchParams(window.location.search);
					
					var wordParam = urlParams.get("word");
					if (wordParam)
					{
						wordElement.value = wordParam;
					}
				
					querySubmit();
					isPostBack = true;
				}
				else
				{
					querySubmit();
				}
			}

			function querySubmit()
			{
				let target = 0;
				let column = "";
	
				target = Math.parseFloat(wordElement.value);
				column = columnVerseIDSequencePercent;
				const closestVerseForward = Bible.Table.reduce((prev, curr) => {
					return (Math.abs(curr[column] - target) < Math.abs(prev[column] - target)) ? curr : prev;
				});

				target = Math.parseFloat(wordElement.value);
				column = columnChapterIDSequencePercent;
				const closestChapterForward = Bible.Table.reduce((prev, curr) => {
					return (Math.abs(curr[column] - target) < Math.abs(prev[column] - target)) ? curr : prev;
				});

				target = 100 - Math.parseFloat(wordElement.value);
				column = columnChapterIDSequencePercent;
				const closestChapterBackward = Bible.Table.reduce((prev, curr) => {
					return (Math.abs(curr[column] - target) < Math.abs(prev[column] - target)) ? curr : prev;
				});

				target = 100 - Math.parseFloat(wordElement.value);
				column = columnVerseIDSequencePercent;
				const closestVerseBackward = Bible.Table.reduce((prev, curr) => {
					return (Math.abs(curr[column] - target) < Math.abs(prev[column] - target)) ? curr : prev;
				});

				scriptureReferenceVerseForward = closestVerseForward.ScriptureReference;
				scriptureReferenceChapterForward = closestChapterForward.BookTitle + closestChapterForward.ChapterID;

				scriptureReferenceChapterBackward = closestChapterBackward.BookTitle + closestChapterBackward.ChapterID;
				scriptureReferenceVerseBackward = closestVerseBackward.ScriptureReference;
				
				scriptureReferenceElement.innerHTML = scriptureReferenceVerseForward + ", " +
					scriptureReferenceChapterForward + ", " +
					scriptureReferenceChapterBackward + ", " +
					scriptureReferenceVerseBackward
				;
			}

			window.addEventListener("load", pageLoad, false);
			
			submitQueryElement.addEventListener("click", querySubmit, false);
			
			var body = document.getElementsByTagName('body')[0];
			body.onkeydown = function (e) {
				if (e.keyCode === 13) {  //enter key code
					querySubmit();
				}
			}
			
			const columnVerseIDSequencePercent = "VerseIDSequencePercent";
			const columnChapterIDSequencePercent = "ChapterIDSequencePercent";
		</script>
	</body>
