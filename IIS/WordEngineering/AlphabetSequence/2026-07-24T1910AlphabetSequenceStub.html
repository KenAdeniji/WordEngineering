	<body>
		<div align="center">
			<table>
				<tr>
					<td><label for="word">Word</label></td>
					<td><input id="word" type="text" value="Hello world." autofocus></td>
				</tr>
				<tr>
					<td colspan="2" align="center"><input type="submit" id="submitQuery"></td>
				</tr>
			</table>
			<div id="alphabetSequenceIndex"></div>
			<div id="verseForward"></div>
			<div id="chapterForward"></div>
			<div id="chapterBackward"></div>
			<div id="verseBackward"></div>
		</div>

		<script>
			let scriptElement = document.createElement("script");
			scriptElement.setAttribute("src", "./Bible.js");
			document.body.appendChild(scriptElement);
		</script>

		<script>
			//import { BibleJSON } from "./Bible.json"
			//let {BibleJSON} = await import("./Bible.json")	

			const	wordElement = document.getElementById("word");
			const	submitQueryElement = document.getElementById("submitQuery");
			
			const	alphabetSequenceIndexElement = document.getElementById("alphabetSequenceIndex");
			
			const	chapterForwardElement = document.getElementById("chapterForward");
			const	chapterBackwardElement = document.getElementById("chapterBackward");
			
			const	verseForwardElement = document.getElementById("verseForward");
			const	verseBackwardElement = document.getElementById("verseBackward");
			
			var 	isPostBack = false;

			function pageLoad()
			{
				if (isPostBack === false)
				{
					const urlParams = new URLSearchParams(window.location.search);
					
					var wordParam = urlParams.get("word");
					if (wordParam)
					{
						wordElement.value = wordParam;
					}
				
					querySubmit();
					isPostBack = true;
				}
				else
				{
					querySubmit();
				}
			}

			function querySubmit()
			{
				alphabetSequenceQuery();
			}
			
			function alphabetSequenceQuery()
			{
				alphabetSequenceIndexElement.innerHTML = "";

				if (!isNaN(parseFloat(wordElement.value)) && isFinite(wordElement.value))
				{
					alphabetSequenceIndexElement.innerHTML = wordElement.value;
				}
				else
				{
					let alphabetSequencePlace = 0;
					let wordUpperCase = wordElement.value.toUpperCase();
					let letterASCII;
					for (let letterIndex = 0; letterIndex < wordUpperCase.length; letterIndex++) 
					{
						letterASCII = wordUpperCase.charCodeAt(letterIndex);
						if (letterASCII >= 65 && letterASCII <= 90)
						{
							alphabetSequencePlace += letterASCII - 64;
						}
					}					
					alphabetSequenceIndexElement.innerHTML = alphabetSequencePlace;	
				}
				getData();
			}
			
			async function getData() 
			{
				const verseIDSequenceForward = (alphabetSequenceIndexElement.innerHTML % VerseIDMaximum) - 1;
				const verseIDSequenceForwardScriptureReference = scriptureReferenceConcatenate(Bible.Table[verseIDSequenceForward].BookTitle, Bible.Table[verseIDSequenceForward].ChapterID, Bible.Table[verseIDSequenceForward].VerseID);
				const verseIDSequenceForwardVerseText = Bible.Table[verseIDSequenceForward].KingJamesVersion;

				const verseIDSequenceBackward = VerseIDMaximum - verseIDSequenceForward - 2;
				const verseIDSequenceBackwardScriptureReference = scriptureReferenceConcatenate(Bible.Table[verseIDSequenceBackward].BookTitle, Bible.Table[verseIDSequenceBackward].ChapterID, Bible.Table[verseIDSequenceBackward].VerseID);
				const verseIDSequenceBackwardVerseText = Bible.Table[verseIDSequenceBackward].KingJamesVersion;
				
				const chapterIDSequenceForward = (alphabetSequenceIndexElement.innerHTML % ChapterIDMaximum);
				const chapterIDSequenceForwardChapterText = Bible.Table.filter(function(element) { return element.ChapterIDSequence === chapterIDSequenceForward; });
				const chapterIDSequenceForwardScriptureReference = chapterIDSequenceForwardChapterText[0].BookTitle + " " + chapterIDSequenceForwardChapterText[0].ChapterID;

				const chapterIDSequenceBackward = ChapterIDMaximum - chapterIDSequenceForward;
				const chapterIDSequenceBackwardChapterText = Bible.Table.filter(function(element) { return element.ChapterIDSequence === chapterIDSequenceBackward; });
				const chapterIDSequenceBackwardScriptureReference = chapterIDSequenceBackwardChapterText[0].BookTitle + " " + chapterIDSequenceBackwardChapterText[0].ChapterID;			
			
				var scriptureReference = "";
			
				var forwardChapterText = "<table><caption>" + chapterIDSequenceForwardScriptureReference + "</caption><tbody>";
				for (var chapterIndex = 0; chapterIndex < chapterIDSequenceForwardChapterText.length; chapterIndex++)
				{
					forwardChapterText += "<tr><td>" + 
						scriptureReferenceConcatenate(chapterIDSequenceForwardChapterText[chapterIndex].BookTitle, chapterIDSequenceForwardChapterText[chapterIndex].ChapterID, chapterIDSequenceForwardChapterText[chapterIndex].VerseID) +
						"</td><td>" + chapterIDSequenceForwardChapterText[chapterIndex].KingJamesVersion + "</td></tr>";
				}
				forwardChapterText += "</tbody></table>";
				
				var backwardChapterText = "<table><caption>" + chapterIDSequenceBackwardScriptureReference + "</caption><tbody>";
				for (var chapterIndex = 0; chapterIndex < chapterIDSequenceBackwardChapterText.length; chapterIndex++)
				{
					backwardChapterText += "<tr><td>" + 
						scriptureReferenceConcatenate(chapterIDSequenceBackwardChapterText[chapterIndex].BookTitle, chapterIDSequenceBackwardChapterText[chapterIndex].ChapterID, chapterIDSequenceBackwardChapterText[chapterIndex].VerseID) +
						"</td><td>" + chapterIDSequenceBackwardChapterText[chapterIndex].KingJamesVersion + "</td></tr>";
				}
				backwardChapterText += "</tbody></table>";
				
				verseForwardElement.innerHTML = verseIDSequenceForwardVerseText + " (" + verseIDSequenceForwardScriptureReference + ")";
				verseBackwardElement.innerHTML = verseIDSequenceBackwardVerseText + " (" + verseIDSequenceBackwardScriptureReference + ")";

				chapterForwardElement.innerHTML = forwardChapterText;
				chapterBackwardElement.innerHTML = backwardChapterText;
			}
			
			function scriptureReferenceConcatenate(bookTitle, chapterID, verseID) 
			{
				return bookTitle + " " + chapterID + ":" + verseID;
			}
			
			window.addEventListener("load", pageLoad, false);
			
			submitQueryElement.addEventListener("click", querySubmit, false);
			
			var body = document.getElementsByTagName('body')[0];
			body.onkeydown = function (e) {
				if (e.keyCode === 13) {  //enter key code
					querySubmit();
				}
			}
			
			const ChapterIDMaximum = 1189;
			const VerseIDMaximum = 31103;
		</script>
	</body>
</html>
