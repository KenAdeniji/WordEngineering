	<body>
		<div align="center">
			<div>
				<table>
					<tr>
						<td><label for="word">Word</label></td>
						<td><input id="word" value="Faith An" autofocus/></td>
					</tr>
					<tr>
						<td><label for="sorrounding">Sorrounding</label></td>
						<td>
							<select id="sorrounding"></select>
						</td>
					</tr>
					<tr>
						<td><label for="limit">Limit</label></td>
						<td>
							<input id="limitValueOrPercentage" type="number" value="100" step="1" min="0"/>
							<div>
								<input type="radio" id="limitPercentage" name="limitValuePercentage" value="percentage" checked/>
								<label for="limitPercentage">Percentage</label>
							</div>
							<div>
								<input type="radio" id="limitValue" name="limitValuePercentage" value="value"/>
								<label for="limitValue">Value</label>
							</div>
						</td>
					</tr>
					<tr>
						<td><label for="orderBy">Order by</label></td>
						<td>
							<select id="orderBy"></select>
						</td>
					</tr>
					<tr>
						<td><label for="countRowsOccurrence">Count rows or occurrence</label></td>
						<td>
							<select id="countRowsOccurrence"></select>
						</td>
					</tr>
					<tr>
						<td><label for="ignorePartsOfSpeech">Ignore parts of speech</label></td>
						<td><input id="ignorePartsOfSpeech" type="checkbox"/></td>
					</tr>
					<tr>
						<td colspan="2" align="center"><input type="submit" id="submitQuery"></td>
					</tr>
				</table>
			</div>	
			<textarea id="resultSetTextArea" rows="10"></textarea>
			<br>
			<table id="resultSetTable"></table>
		</div>

		<script>
			let scriptElement = document.createElement("script");
			scriptElement.setAttribute("src", "./Bible.js");
			document.body.appendChild(scriptElement);
		</script>

		<script>
			const	wordElement = document.getElementById("word");
			const	ignorePartsOfSpeechElement = document.getElementById("ignorePartsOfSpeech");
			const	limitValueOrPercentageElement = document.getElementById("limitValueOrPercentage");
			const	limitValueElement = document.getElementById("limitValue");
			const	limitPercentageElement = document.getElementById("limitPercentage");
			const	submitQueryElement = document.getElementById("submitQuery");
			
			const	resultSetTextAreaElement = document.getElementById("resultSetTextArea");
			
			const	resultSetTableElement = document.getElementById("resultSetTable");
			
			var 	isPostBack = false;

			function pageLoad()
			{
				if (isPostBack === false)
				{
					buildSelect("sorrounding", Sorrounding);
					buildSelect("orderBy", OrderBy);
					buildSelect("countRowsOccurrence", CountRowsOccurrence);

					const urlParams = new URLSearchParams(window.location.search);
					
					var wordParam = urlParams.get("word");
					if (wordParam)
					{
						wordElement.value = wordParam;
					}
				
					querySubmit();
					isPostBack = true;
				}
				else
				{
					querySubmit();
				}
			}

			function buildSelect(selectControl, selectChoices)
			{
				var select = document.getElementById(selectControl);
				select.options.length = 0;
				for (var index = 0, length = selectChoices.length; index < length; ++index)
				{
					var option = document.createElement("option");
					var multiDimensionArray = (selectChoices[index].constructor === Array);
					if (selectChoices[index]["text"])
					{
						option.text = selectChoices[index]["text"];
						if (selectChoices[index]["value"])
						{
							option.value = selectChoices[index]["value"];
						}	
						else
						{
							option.value = selectChoices[index]["text"];
						}	
					}	
					else if(multiDimensionArray)				
					{	
						option.text = selectChoices[index][0];
						option.value = selectChoices[index][1];
					}
					else
					{
						option.text = selectChoices[index];
						option.value = selectChoices[index];
					}				
					select.appendChild(option);
				}
			}
	
			function querySubmit()
			{
				const searchWord = wordElement.value.toLowerCase();
				
				const bibleFiltered = Object.values(Bible.Table).filter(item => item.KingJamesVersion.toLowerCase().includes(searchWord));
					
				let combinedText = "";
				
				for (const element of bibleFiltered) 
				{
					combinedText += element.KingJamesVersion + " ";
				}
				
				combinedText = combinedText.trim();

				var combinedWord = combinedText
					.toLowerCase()
					.replace(/[^\w\s]/g, '') // removes punctuation
					.split(/\s+/);          // splits by spaces

				if ( ignorePartsOfSpeechElement.checked )
				{
					combinedWord = combinedWord.filter(word => !PartsOfSpeechArray.includes(word));
				}	

				var wordsSplit = countWords(combinedWord.join(" "));
				
				const selectedRadioLimitValuePercentage = document.querySelector("input[name='limitValuePercentage']:checked");
				const selectedRadioLimitValuePercentageValue = selectedRadioLimitValuePercentage.value;
				const limitValueOrPercentageNumber = parseFloat(limitValueOrPercentageElement.value);
				
				const limitValueOrPercentageNumberSelection = (selectedRadioLimitValuePercentageValue === "value") 
					? limitValueOrPercentageNumber
					: Math.round((Object.keys(wordsSplit).length * limitValueOrPercentageNumber ) * 1 / 100 );

				wordsSplit = Object.fromEntries(
					Object.entries(wordsSplit).slice(0, limitValueOrPercentageNumberSelection)
				);				
				
				resultSetTextAreaElement.value = JSON.stringify(wordsSplit);
				
				var resultSetTableStub = `<thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>`;
				for (const [key, value] of Object.entries(wordsSplit)) {
					resultSetTableStub += `<tr><td>${key}</td><td>${value}</td></tr>`;
				}				
				resultSetTableStub += "</tbody>";
				resultSetTableElement.innerHTML = resultSetTableStub;
			}
			
			

			function countWords(sentence) {
				var list = sentence.split(' ');
				var words = {};
				for(var i = 0; i < list.length; i++) {
					var word = list[i];
					if (words.hasOwnProperty(word)) {
						words[word]++;
					} else {
						words[word] = 1;
					}
				}
				return words;
			}
			
			window.addEventListener("load", pageLoad, false);
			
			submitQueryElement.addEventListener("click", querySubmit, false);
			
			var body = document.getElementsByTagName('body')[0];
			body.onkeydown = function (e) {
				if (e.keyCode === 13) {  //enter key code
					querySubmit();
				}
			}
			
			const Sorrounding = ["Verse", "Chapter", "Book", "Book Group", "Testament", "Bible"];
			const OrderBy = ["Occurrence", "Proximity"];
			const CountRowsOccurrence = ["Rows", "Occurrence"];
			const PartsOfSpeech = 
			"can, could, will, would, shall, should, may, might, must, " + //Verbs
			"have, has, had, do, does, did,be, am, is, are, was, were, been, being, " +
			"a, an, the, " + //Adjectives
			"I, he, we, she, they, me, him, us, her, them, it, this, that, who, which, what, " + //Pronouns
			"my, mine, his, her, hers, our, ours, their, theirs, your, yours, its, whose, " +
			"at, to, with, from, for, of, on, in, into, onto,between, under, over, against, around, " + //Prepositions
			"for, and, nor, but, or, yet, so, " + //Conjunctions
			"because, when, while, as, since, although, whenever, " +
			"not, very, often, here, almost, always, never, there, too, " + //Adverbs
			"Oh, Ouch, yes, no, false, true"; //Interjections
			const PartsOfSpeechArray = PartsOfSpeech.split(", ");
		</script>
	</body>
