		<style>
	html, body{
	  height: 100%;
	  width: 100%;
	}
	textarea{ //viewport
		height: 65vh;
		width: 50vw;
	}
body {
	/*background-color: #FF9500; */

	margin: 0 auto; /* Is what separates one tag from another. */
	padding: 0 20px 20px 20px; /* Is the space between the content and the content's border. */ 
	/* width: 600px; */

.focus {
  background-color: #ff00ff;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
}

/* div inside a div, border. */

html {
	background-color: #00539F;
	font-family: Arial, Helvetica, sans-serif;
}

table {
   border: 1px solid black;
   border-spacing: 5px;
   border-collapse: separate;
   /* width:100%; */ 
}

th, td { 
	padding:5px 10px; border:#4e95f4 1px solid;
}

/*  Define the background color for all the ODD background rows  */

	background: #b8d1f3;
}

/*  Define the background color for all the EVEN background rows  */

	background: #dae5f4;

	</head>
	<body>
		<div align="center">
			<table>
				<tr>
					<td><textarea id="word" autofocus>Word</textarea></td>
				</tr>
				<tr>
					<td align="center"><input type="submit" id="submitQuery"></td>
				</tr>
			</table>
			<div id="resultSet"></div>
		</div>

		<script>
			let scriptElement = document.createElement("script");
			scriptElement.setAttribute("src", "./Bible.js");
			document.body.appendChild(scriptElement);
		</script>

		<script>
			const	wordElement = document.getElementById("word");
			const	submitQueryElement = document.getElementById("submitQuery");
			
			const	resultSetElement = document.getElementById("resultSet");
			
			var 	isPostBack = false;

			function pageLoad()
			{
				if (isPostBack === false)
				{
					const urlParams = new URLSearchParams(window.location.search);
					
					var wordParam = urlParams.get("word");
					if (wordParam)
					{
						wordElement.value = wordParam;
					}
				
					querySubmit();
					isPostBack = true;
				}
				else
				{
					querySubmit();
				}
			}

			function querySubmit()
			{
				let bibleFiltered = Bible.Table.filter(v=> Object.keys(v).filter(key=> v[key].toString().toLowerCase().includes(wordElement.value.toLowerCase())).length > 0);
				
				let htmlTable = `<table><caption>Rows occurrences: ${bibleFiltered.length}</caption><thead><tr><th>Scripture Reference</th><th>Sacred Text</th></tr><tbody>`;
				for (const element of bibleFiltered) 
				{
					htmlTable += `<tr><td>${element.BookTitle} ${element.ChapterID}:${element.VerseID}</td><td>${element.KingJamesVersion}</td></tr>`
				}
				resultSetElement.innerHTML = htmlTable;
			}

			window.addEventListener("load", pageLoad, false);
			
			submitQueryElement.addEventListener("click", querySubmit, false);
			
			var body = document.getElementsByTagName('body')[0];
			body.onkeydown = function (e) {
				if (e.keyCode === 13) {  //enter key code
					querySubmit();
				}
			}
		</script>
	</body>
</html>
