		<table id="whatIHaveAsAPeriod">

		<script type="module">
			//import { WhatIHaveAsAPeriod } from "./2026-11-10IlyaKantor_-_JavaScript.info_-_WhatIHaveAsAPeriod.js"
			let {WhatIHaveAsAPeriod} = await import("./2026-11-10IlyaKantor_-_JavaScript.info_-_WhatIHaveAsAPeriod.js")

			function addTableData(row, content)
			{		
				let td = document.createElement("td");
				td.textContent = content;
				row.appendChild(td);
			}
			
			function iterateTable()
			{		
				var table = document.getElementById("whatIHaveAsAPeriod");
				var count = table.rows.length;

				const headerRow = table.rows[0];
				for (const headerColumn of ComputedHeaderRowColumns) {
						let th = document.createElement("th");
						th.textContent = headerColumn;
						headerRow.appendChild(th);
				}
							
				let diff;
				let tdDays;
				let tdBiblicalCalendar;
				let tdGregorianCalendar;

				for(var i=1; i<count; i++) {   
				
					// Find the current row container
					const row = table.rows[i];
					
					// Pull the values from the specific row inputs
					const datedFrom = new Date(row.cells[1].innerHTML) || new Date();
					const datedUntil = new Date(row.cells[2].innerHTML) || new Date();

					// Compute the calculation
					const days = WhatIHaveAsAPeriod.daysDifference(datedFrom, datedUntil);
					diff = WhatIHaveAsAPeriod.getDateDifference(datedFrom, datedUntil);
					
					addTableData(row, days);
					addTableData(row, WhatIHaveAsAPeriod.biblicalCalendarDifference(days));
					addTableData(row, `${diff.years} years, ${diff.months} months, ${diff.days} days`);
				}
			}

			window.addEventListener('load', function(){
				iterateTable();
			});
			
			const ComputedHeaderRowColumns = [
				"Days",
				"Biblical Calendar",
				"Gregorian Calendar"
			];	
		</script>
